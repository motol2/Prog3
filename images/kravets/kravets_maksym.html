<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderní Interaktivní Kalkulačka</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --calc-bg: #1e293b;
            --text-color: #f8fafc;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --op-color: #f59e0b;
            --op-hover: #d97706;
            --clear-color: #ef4444;
            --clear-hover: #dc2626;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #1e1b4b);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: var(--calc-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 340px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .display {
            background-color: #0f172a;
            padding: 20px;
            text-align: right;
            word-break: break-all;
            word-wrap: break-word;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        #history {
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 20px;
            margin-bottom: 5px;
        }

        #result {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            padding: 15px 0;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-op {
            background-color: var(--op-color);
            font-weight: bold;
        }
        .btn-op:hover {
            background-color: var(--op-hover);
        }

        .btn-clear {
            background-color: var(--clear-color);
            font-weight: bold;
        }
        .btn-clear:hover {
            background-color: var(--clear-hover);
        }

        .btn-equals {
            background-color: var(--accent-color);
            grid-column: span 2;
            font-weight: bold;
        }
        .btn-equals:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div id="history"></div>
            <div id="result">0</div>
        </div>
        <div class="buttons">
            <button class="btn-clear" onclick="clearAll()">C</button>
            <button onclick="deleteDigit()">⌫</button>
            <button onclick="appendOperator('%')" class="btn-op">%</button>
            <button onclick="appendOperator('/')" class="btn-op">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="appendOperator('*')" class="btn-op">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="appendOperator('-')" class="btn-op">-</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button onclick="appendOperator('+')" class="btn-op">+</button>

            <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendDot()">.</button>
            <button class="btn-equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let historyInput = '';
        let resetScreen = false;

        const resultEl = document.getElementById('result');
        const historyEl = document.getElementById('history');

        function updateDisplay() {
            resultEl.innerText = currentInput;
            historyEl.innerText = historyInput;
        }

        function appendNumber(number) {
            if (currentInput === '0' || resetScreen) {
                currentInput = number;
                resetScreen = false;
            } else {
                currentInput += number;
            }
            updateDisplay();
        }

        function appendDot() {
            if (resetScreen) {
                currentInput = '0.';
                resetScreen = false;
                updateDisplay();
                return;
            }
            if (!currentInput.includes('.')) {
                currentInput += '.';
                updateDisplay();
            }
        }

        function appendOperator(op) {
            if (resetScreen) {
                resetScreen = false;
            }
            historyInput += currentInput + ' ' + op + ' ';
            currentInput = '0';
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            historyInput = '';
            updateDisplay();
        }

        function deleteDigit() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function calculate() {
            try {
                let fullExpression = historyInput + currentInput;
                // Nahrazení vizuálních symbolů za programovací
                let sanitizedExpression = fullExpression.replace(/×/g, '*').replace(/÷/g, '/');
                
                let evalResult = eval(sanitizedExpression);
                
                historyInput = fullExpression + ' =';
                currentInput = String(evalResult);
                resetScreen = true;
                updateDisplay();
            } catch (error) {
                currentInput = 'Chyba';
                resetScreen = true;
                updateDisplay();
            }
        }
    </script>
</body>
</html>
